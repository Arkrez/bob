name: bob-sim

services:
  sim:
    build:
      context: .
      dockerfile: Dockerfile.sim
    image: bob-sim:humble
    platform: linux/amd64
    container_name: bob-sim
    init: true
    volumes:
      - ..:/workspace
      # colcon build/install/log live here, so the repo's own build/ and install/ are untouched
      - colcon:/colcon
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ROS_DOMAIN_ID: "0"
      WEBOTS_HOST: host.docker.internal
      WEBOTS_PORT: "1234"
      WEBOTS_ROBOT: Bob
      # set by scripts/start_sim.sh --policy: the bridge runs this walking policy itself
      BOB_POLICY: ${BOB_POLICY:-}
      # set by scripts/start_sim.sh --nav: walk to the TARGET marker using this navigator
      BOB_NAV: ${BOB_NAV:-}

volumes:
  colcon:
